<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>优德习正 · 线索后台</title>
<link rel="stylesheet" href="./css/style.css">
<style>
  .dash-wrap{max-width:980px;margin:0 auto;padding:24px}
  .dash-head{display:flex;align-items:center;gap:12px;justify-content:space-between;flex-wrap:wrap}
  .setup-box{background:#fffbeb;border:1px solid #fde68a;padding:12px 14px;border-radius:10px;margin:14px 0;font-size:14px}
  .setup-box input{width:100%;padding:8px 10px;border:1px solid #d1d5db;border-radius:8px;margin-top:6px;font-size:13px}
  table.leads{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 16px rgba(0,0,0,.06)}
  table.leads th,table.leads td{padding:10px 12px;text-align:left;border-bottom:1px solid #f1f5f9;font-size:13px}
  table.leads th{background:#f8fafc;color:#475569;font-weight:600;white-space:nowrap}
  .weak-tag{display:inline-block;background:#fee2e2;color:#b91c1c;padding:2px 8px;border-radius:999px;font-size:12px;margin:2px}
  .modal-mask{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;justify-content:center;padding:24px;overflow:auto;z-index:1000}
  .modal-mask.show{display:flex}
  .modal{background:#fff;border-radius:16px;max-width:900px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25)}
  .modal-bar{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 20px;border-bottom:1px solid #eef2f7;z-index:2}
  .modal-body{padding:0 20px 24px}
  .empty{text-align:center;color:#94a3b8;padding:40px}
  .stat-row{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0 18px}
  .stat{background:#fff;border:1px solid #eef2f7;border-radius:12px;padding:12px 16px;min-width:120px}
  .stat .n{font-size:22px;font-weight:700;color:#2563eb}
  .stat .l{font-size:12px;color:#64748b}
  @media print{
    body *{visibility:hidden}
    .modal,.modal *{visibility:visible}
    .modal{position:absolute;left:0;top:0;box-shadow:none;max-width:100%}
    .modal-bar{display:none}
  }
</style>
</head>
<body>
<div class="dash-wrap">
  <div class="dash-head">
    <div>
      <div style="font-size:13px;color:#2563eb;letter-spacing:2px">优德习正 · 习惯教育</div>
      <h1 style="margin:4px 0;font-size:22px">扫码测评 · 线索后台</h1>
    </div>
    <div style="display:flex;gap:10px">
      <button class="btn btn-outline" id="refreshBtn">↻ 刷新</button>
      <button class="btn btn-primary" id="loadBtn">加载线索</button>
      <button class="btn btn-outline" id="clearBtn" style="color:#b91c1c;border-color:#fecaca">🗑 清空全部</button>
    </div>
  </div>

  <div class="setup-box" id="setupBox">
    ⚠️ 尚未配置 CloudBase 云函数地址。把下面两项粘贴进来（仅本浏览器记住；要永久生效请让我写进 <code>config.js</code>）：
    <div style="margin-top:6px;color:#92400e;font-size:13px">① 云函数 HTTP 触发地址（形如 https://xxxx.apigw.tencentcs.com/release/udxzLeads）</div>
    <input id="cbHttpInput" placeholder="https://xxxx.apigw.tencentcs.com/release/udxzLeads">
    <div style="margin-top:8px;color:#92400e;font-size:13px">② 后台管理密码（与云函数内 ADMIN_PWD 一致，默认 udxz2026）</div>
    <input id="cbPwdInput" placeholder="udxz2026">
    <div style="margin-top:8px"><button class="btn btn-primary" id="saveUrlBtn" style="padding:6px 14px;font-size:13px">保存并使用</button></div>
  </div>

  <div class="stat-row" id="statRow" style="display:none"></div>
  <div id="listArea"></div>
</div>

<div class="modal-mask" id="modal">
  <div class="modal">
    <div class="modal-bar">
      <strong id="modalTitle">线索详情</strong>
      <div style="display:flex;gap:8px">
        <button class="btn btn-outline" id="printBtn" style="padding:6px 14px;font-size:13px">🖨 打印方案</button>
        <button class="btn btn-outline" id="closeBtn" style="padding:6px 14px;font-size:13px">关闭</button>
      </div>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script src="./js/config.js"></script>
<script src="./js/solution-live.js"></script>
<script src="./js/admin2.js"></script>
</body>
</html>
